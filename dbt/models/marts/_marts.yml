version: 2

models:
  - name: mart_quarterly_consumption
    description: "Quarterly energy and infrastructure consumption KPIs by energy carrier, group, sub_group, and object."
    columns:
      - name: year_quarter
        tests: [not_null]
      - name: energy_carrier
        tests: [not_null]
      - name: object_id
        tests: [not_null]
      - name: total_consumption
        tests: [not_null]

  - name: mart_quarterly_pv_summary
    description: "Quarterly PV production, grid feed-in, grid import, self-consumption rate, and autarky KPIs per PV site."
    columns:
      - name: year_quarter
        tests: [not_null]
      - name: site_metering_point_id
        tests: [not_null]
      - name: plant_mode
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["self_consumption", "full_feed_in"]

  - name: mart_plausibility_summary
    description: "Quarterly data quality, meter tree depth, interval completeness, PV balance, and residual scorecard."
    columns:
      - name: year_quarter
        tests: [not_null]
      - name: metering_point_id
        tests: [not_null]
      - name: meter_level
        tests: [not_null]
