version: 2

models:
  - name: stg_measurements
    description: "Standardized measurements loaded directly from partitioned Apache Parquet."
    columns:
      - name: timestamp_utc
        tests: [not_null]
      - name: metering_point_id
        tests: [not_null]
      - name: energy_carrier
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["electricity", "water", "gas", "heating", "other"]
      - name: reading_type
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["interval", "cumulative", "instantaneous"]

  - name: stg_objects
    description: "Objects with functional object_class and two-level organizational groupings from SQLite."
    columns:
      - name: object_id
        tests: [not_null, unique]
      - name: object_class
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["building", "school", "public_lighting", "water_supply", "sports", "mobility", "other"]

  - name: stg_metering_points
    description: "Self-describing metering point tree (parent_metering_point_id = NULL for main meters) from SQLite."
    columns:
      - name: metering_point_id
        tests: [not_null, unique]
      - name: object_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_objects')
                field: object_id
      - name: energy_carrier
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["electricity", "water", "gas", "heating", "other"]

  - name: stg_estimation_rules
    description: "Time-bounded percentage allocation rules for splitting residual consumption across unmetered objects."
    columns:
      - name: rule_id
        tests: [not_null, unique]
      - name: source_metering_point_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_metering_points')
                field: metering_point_id
      - name: target_object_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_objects')
                field: object_id
