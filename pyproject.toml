[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "localems"
version = "0.1.0"
description = "Local-first Energy Management System toolkit: 15-minute utility data (Parquet), hierarchical meter tree & master-data roundtrip (SQLite <-> .xlsx), quarterly reporting (dbt-duckdb), and PV analytics."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "polars>=1.0",
    "pyarrow>=16.0",
    "openpyxl>=3.1",
    "pydantic>=2.7",
    "duckdb>=1.1",
]

[project.optional-dependencies]
analytics = [
    "dbt-core>=1.8",
    "dbt-duckdb>=1.8",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
notebook = [
    "ipykernel>=6.29",
    "jupyterlab>=4.2",
]

[project.scripts]
localems = "localems.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/localems"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
